<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

<style>

*{
    font-family: 'Poppins', sans-serif;
}

body{
    background: linear-gradient(135deg,#dbeafe,#bfdbfe,#eff6ff);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Card */

.register-card{
    border: none;
    border-radius: 25px;
    padding: 40px;
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

/* Title */

.register-title{
    text-align: center;
    font-size: 35px;
    font-weight: 700;
    color: #0d6efd;
    margin-bottom: 10px;
}

.sub-text{
    text-align: center;
    color: gray;
    margin-bottom: 30px;
}

/* Form */

form p{
    margin-bottom: 18px;
}

form label{
    font-weight: 500;
    margin-bottom: 6px;
}

form input,
form textarea,
form select{

    width: 100%;
    border-radius: 12px !important;
    border: 1px solid #ced4da !important;
    padding: 12px;
}

/* Focus */

form input:focus,
form textarea:focus,
form select:focus{

    border-color: #0d6efd !important;
    box-shadow: 0 0 8px rgba(13,110,253,.25);
    outline: none;
}

/* Button */

.register-btn{
    background: linear-gradient(90deg,#0d6efd,#2563eb);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 18px;
    font-weight: 600;
    transition: 0.3s;
}

.register-btn:hover{
    transform: translateY(-2px);
    background: linear-gradient(90deg,#0b5ed7,#1d4ed8);
}

/* Card Animation */

.register-card:hover{
    transform: translateY(-3px);
    transition: 0.3s;
}

</style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card register-card">

                <h2 class="register-title">
                    SmartVaxCare
                </h2>

                <p class="sub-text">
                    Create your parent account
                </p>

                <form method="POST"
                      enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit"
                            class="btn register-btn w-100">

                        Register

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
