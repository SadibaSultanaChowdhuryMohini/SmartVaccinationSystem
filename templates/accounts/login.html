<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{
            font-family: 'Poppins', sans-serif;
        }
        body{
            background: linear-gradient(135deg, #e0e4ec, #99c1f1,#f5fbff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card{
            border: none;
            border-radius: 25px;
            padding: 40px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .login-title{
            font-size: 35px;
            font-weight: 700;
            text-align: center;
            color: #0d6efd;
            margin-bottom: 30px;
        }
        form p{
            margin-bottom: 18px;
        }
        form input{
            width: 100%;
            border-radius: 12px !important;
            border: 1px solid #ced4da !important;
            padding: 12px;
        }
        form input:focus{
            border-color: #0d6efd !important;
            box-shadow: 0 0 8px rgba(13,110,253,.25);
            outline: none;
        }
        .login-btn{
            background: #0d6efd;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
        }
        .login-btn:hover{
            background: #0b5ed7;
            transform: translateY(-2px);
        }
        .sub-text{
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card">
                <h2 class="login-title">
                    SmartVaxCare Login
                </h2>
                <p class="sub-text">
                    Login to access the vaccination recovery system
                </p>
                <form method="POST">

                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn login-btn w-100">
                        Login
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
