{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0e4ec, #99c1f1, #f5fbff);
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }

        .profile-card {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .profile-title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        form input,
        form textarea,
        form select {
            width: 100%;
            border-radius: 12px !important;
            border: 1px solid #ced4da !important;
            padding: 12px;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            border-color: #0d6efd !important;
            box-shadow: 0 0 8px rgba(13,110,253,.25);
            outline: none;
        }

        .update-btn {
            background: #0d6efd;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
            width: 100%;
            color: white;
        }

        .update-btn:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
<div class="page-wrapper">
    <div class="profile-card">
        <h2 class="profile-title">Edit Profile</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="update-btn">
                Update Profile
            </button>
        </form>
    </div>
</div>
</body>
</html>
