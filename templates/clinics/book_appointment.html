<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e0e4ec, #99c1f1, #f5fbff); min-height: 100vh; }
        .card { border: none; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        form p { margin-bottom: 15px; }
        form input, form select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-center mb-4 text-primary">Book Appointment</h3>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100">Confirm Booking</button>
                    </form>
                    <a href="{% url 'clinics:clinic_list' %}" class="text-center mt-3 text-decoration-none">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
