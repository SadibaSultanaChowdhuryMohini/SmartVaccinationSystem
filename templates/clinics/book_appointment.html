{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 🎨 হোমপেজের সাথে ম্যাচিং কালার থিম */
        body {
            background-color: #e6f0fa; /* আপনার হোমপেজের হালকা আকাশী ব্যাকগ্রাউন্ড */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ন্যাভবারের কালারের সাথে ম্যাচ করে কার্ডের বর্ডার এবং হেডিং */
        .custom-card {
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            border-top: 6px solid #2b4cb3; /* হোমপেজের ন্যাভবারের সেই গাঢ় নীল কালার */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        .custom-heading {
            color: #2b4cb3; /* ন্যাভবার ম্যাচিং নীল */
            font-weight: bold;
        }

        /* জ্যাঙ্গো ফর্মের (form.as_p) ইনপুট ফিল্ড স্টাইলিং */
        form p {
            margin-bottom: 16px;
        }

        form label {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
            display: block;
            font-size: 14px;
        }

        form input, form select, form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #b0c9e8; /* হালকা নীলচে বর্ডার */
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fbfdff;
            transition: all 0.2s ease;
        }

        /* ইনপুট ফিল্ডে ক্লিক করলে হোমপেজের নীলের মতো গ্লো হবে */
        form input:focus, form select:focus, form textarea:focus {
            border-color: #2b4cb3;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(43, 76, 179, 0.15);
            background-color: #fff;
        }

        /* বোতামের স্টাইল */
        .btn-confirm {
            background-color: #2b4cb3;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-confirm:hover {
            background-color: #1a3485;
            color: white;
        }

        .btn-cancel {
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container py-5 d-flex justify-content-center">
        <div class="card p-4 shadow-sm bg-white custom-card">
            <h3 class="text-center mb-4 custom-heading">Book Appointment</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex gap-2 mt-4">
                    <a href="{% url 'clinic_list' %}" class="btn btn-light border w-100 btn-cancel">Cancel</a>
                    <button type="submit" class="btn btn-confirm w-100">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
