<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Clinics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e0e4ec, #99c1f1, #f5fbff); min-height: 100vh; }
        .card { border: none; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <h2 class="text-center mb-4" style="color: #2b4cb3;">Available Clinics</h2>
        <div class="row">
            {% for clinic in clinics %}
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5>{{ clinic.name }}</h5>
                        <p class="text-muted">{{ clinic.location }}</p>
                        <a href="{% url 'clinics:clinic_detail' clinic.id %}" class="btn btn-primary w-100">View Details</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
