<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinic Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e0e4ec, #99c1f1, #f5fbff); min-height: 100vh; }
        .card { border: none; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-primary">{{ clinic.name }}</h3>
                    <hr>
                    <p><strong>Location:</strong> {{ clinic.location }}</p>
                    <p><strong>Contact:</strong> {{ clinic.contact_number }}</p>
                    <p><strong>Email:</strong> {{ clinic.email }}</p>
                    <p><strong>Time:</strong> {{ clinic.opening_hours }}</p>
                    <p><strong>Price Range:</strong> {{ clinic.vaccine_price_range }}</p>
                    <p><strong>Notes:</strong> {{ clinic.special_notes }}</p>

                    <a href="{% url 'clinics:book_appointment' %}" class="btn btn-primary w-100 mb-2">Book Appointment</a>
                    <a href="{% url 'clinics:clinic_list' %}" class="btn btn-secondary w-100">Back to List</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
