<!DOCTYPE html>
<html>
<head>
    <title>Create Recovery</title>
    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body{
            background: linear-gradient(135deg, #e0e4ec, #99c1f1, #f5fbff);
            min-height: 100vh;
        }

        .card{
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .card-header{
            font-weight: 600;
        }

        .btn{
            border-radius: 10px;
        }
    </style>

</head>

<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>Create Recovery</h3>
                </div>

                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <button class="btn btn-success w-100">
                            Save Recovery
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
